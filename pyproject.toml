[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qianji-animal-motion"
version = "0.2.0"
description = "Traceable animal mesh and 2D keypoint preparation tools for QianJi."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "KeW"},
]
dependencies = [
    "numpy>=1.26,<2",
    "opencv-python>=4.10,<5",
    "pandas>=2.2,<3",
    "tables>=3.10,<4",
]

[project.optional-dependencies]
dlc = [
    "deeplabcut[modelzoo]==3.0.0",
]
gui = [
    "deeplabcut[gui]==3.0.0",
]
dev = [
    "pytest>=8,<9",
]

[project.urls]
Repository = "https://github.com/39394480ke-sys/qianji-animal-motion"

[project.scripts]
qianji-convert-mesh = "qianji_animal_motion.mesh_convert:main"
qianji-preprocess-video = "qianji_animal_motion.preprocess:main"
qianji-suggest-anchor = "qianji_animal_motion.anchor_selection:main"
qianji-map-keypoints = "qianji_animal_motion.semantic_cli:main"
qianji-export-cvat = "qianji_animal_motion.cvat_correction:export_main"
qianji-import-cvat = "qianji_animal_motion.cvat_correction:import_main"
qianji-lift-keypoints = "qianji_animal_motion.lift_cli:main"
qianji-export-39-keypoints = "qianji_animal_motion.keypoints_39_cli:main"
qianji-lift-39-keypoints = "qianji_animal_motion.lift_39_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
