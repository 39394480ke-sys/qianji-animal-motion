[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qianji-animal-motion"
version = "0.1.0"
description = "Animal video keypoint trajectories for the QianJi biomimetic project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deeplabcut[modelzoo]==3.0.0",
]

[project.optional-dependencies]
gui = [
    "deeplabcut[gui]==3.0.0",
]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
qianji-map-keypoints = "qianji_animal_motion.semantic_cli:main"
qianji-export-cvat = "qianji_animal_motion.cvat_correction:export_main"
qianji-import-cvat = "qianji_animal_motion.cvat_correction:import_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
