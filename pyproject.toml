[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qianji-animal-motion"
version = "0.1.0"
description = "Animal mesh and video-motion input tools for the QianJi biomimetic project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deeplabcut[modelzoo]==3.0.0",
]

[project.optional-dependencies]
gui = [
    "deeplabcut[gui]==3.0.0",
]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
qianji-convert-mesh = "qianji_animal_motion.mesh_convert:main"
qianji-preprocess-video = "qianji_animal_motion.preprocess:main"
qianji-suggest-anchor = "qianji_animal_motion.anchor_selection:main"
qianji-map-keypoints = "qianji_animal_motion.semantic_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
