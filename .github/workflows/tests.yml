name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install project
        run: python -m pip install --editable ".[dev]"
      - name: Run tests
        run: python -m pytest

  qianji-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --editable ".[dev]"
      - name: Check out pinned QianJi
        run: |
          git clone https://github.com/muyuan-ma/QianJi.git "$RUNNER_TEMP/QianJi"
          git -C "$RUNNER_TEMP/QianJi" checkout 3f3676c6cb7c198f7c9c43ce0b002f61d3d524a8
          test -z "$(git -C "$RUNNER_TEMP/QianJi" status --porcelain)"
      - name: Run real converter contract test
        env:
          QIANJI_INTEGRATION_ROOT: ${{ runner.temp }}/QianJi
        run: python -m pytest tests/test_qianji_integration.py
